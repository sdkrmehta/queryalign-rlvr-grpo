services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn sql_grpo.serving.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs:ro
    restart: unless-stopped
    environment:
      - LOG_LEVEL=INFO

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    environment:
      - API_URL=http://api:8000
