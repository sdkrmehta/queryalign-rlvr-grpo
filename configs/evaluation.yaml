# Evaluation Harness Configuration
decoding:
  greedy:
    temperature: 0.0
    max_new_tokens: 512
  sampling:
    temperature: 0.7
    top_p: 0.95
    max_new_tokens: 512

benchmarks:
  spider_dev:
    manifest_path: "./data/processed/spider_dev_manifest.jsonl"
  bird_mini_dev:
    manifest_path: "./data/processed/bird_mini_dev_manifest.jsonl"

majority_voting:
  num_candidates: 8
  min_plurality_threshold: 4
  abstain_on_tie: true

output:
  reports_dir: "./reports"
  save_predictions: true
