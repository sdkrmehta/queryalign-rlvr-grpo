services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn sql_grpo.serving.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped
    environment:
      - LOG_LEVEL=INFO
      - HF_HOME=/app/.cache/huggingface
      - GRPO_ADAPTER_PATH=/app/artifacts/phase_4/grpo/final_adapter
      - SFT_ADAPTER_PATH=/app/artifacts/phase_2&3/outputs/sft/best_adapter

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    environment:
      - API_URL=http://api:8000

volumes:
  hf_cache:
