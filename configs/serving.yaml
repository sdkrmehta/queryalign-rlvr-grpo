# Serving Configuration (FastAPI + Streamlit)
server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  timeout_keep_alive: 60

security:
  max_question_length: 500
  max_execution_timeout_ms: 2500
  max_result_rows: 5000
  max_payload_bytes: 1048576

model:
  base_model_id: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  revision: "main"
  default_adapter: "./artifacts/phase_4/grpo/final_adapter"
  sft_adapter: "./artifacts/phase_2&3/outputs/sft/best_adapter"
  device: "auto" # "auto", "cuda", or "cpu"
  load_in_4bit: true # used when CUDA + bitsandbytes are available
  lazy_load: true

generation:
  max_prompt_tokens: 1536
  max_new_tokens: 256
  sampling_temperature: 0.8
  sampling_top_p: 0.95
  num_candidates: 8
  min_plurality_threshold: 3
